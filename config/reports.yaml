# Scheduled reports (plan sections 7 and 8). Adding a report = adding a block here.
# Times use TIMEZONE from .env. REPORT_MODE=dry_run saves to outputs/reports/ instead
# of emailing. During the build, recipients list only the project owner.
# Query and chart names are placeholders until Week 2 builds them.

daily_sales_snapshot:
  schedule: { day_of_week: mon-fri, hour: 7, minute: 0 }
  queries: [kpis_day, top_products_5, cancellations_day]
  compare_to: [same_weekday_last_week]
  charts: [revenue_trend_14d]
  attach_excel: false
  recipients: [you@example.com]

weekly_sales_review:
  schedule: { day_of_week: mon, hour: 8, minute: 0 }
  queries: [kpis_week, category_breakdown, channel_breakdown, top_products, top_customers, demand_alerts]
  compare_to: [previous_week, same_week_last_year]
  charts: [revenue_trend_13w, revenue_by_category]
  attach_excel: true
  recipients: [you@example.com]

monthly_business_review:
  schedule: { day: 1, hour: 8, minute: 0 }
  queries: [kpis_month, margin_by_category, customer_growth, forecast_accuracy]
  compare_to: [previous_month, same_month_last_year]
  charts: [revenue_trend_12m, margin_by_category, new_vs_returning]
  attach_excel: true
  recipients: [you@example.com]
