# Dashboard theme (Week 7 redesign): a quiet emerald palette, Geist (self-hosted in
# src/ui/static/fonts, OFL), 1px borders and no shadows or gradients. The colours are the
# tokens in src/ui/style.py (TOKENS); tests/test_ui.py checks that they match. The viewer
# picks light or dark in the app menu; the default follows the operating system.

[server]
runOnSave = false
# Local use only: on all interfaces anyone on the network could ask questions
# (spending credit) and press the approval buttons.
address = "localhost"
# Serves src/ui/static (the font files) at app/static/.
enableStaticServing = true

[client]
# Hide the developer toolbar and the Deploy button.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/Geist-Variable.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/GeistMono-Variable.woff2"
weight = "100 900"
style = "normal"

[theme]
font = "Geist, system-ui, -apple-system, 'Segoe UI', sans-serif"
codeFont = "'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
baseFontSize = 14
headingFontWeights = 600
baseRadius = "8px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true

# primaryColor is the accent (focus rings, active tab, selected controls); the primary
# button fill is darker (#166534) in light mode for contrast with white text, set in
# style.css. Chart series: accent first, muted second (comparisons).
[theme.light]
primaryColor = "#059669"
backgroundColor = "#F8FAF9"
secondaryBackgroundColor = "#ECFDF5"
textColor = "#14251B"
borderColor = "#D1FAE5"
linkColor = "#047857"
codeBackgroundColor = "#ECFDF5"
dataframeHeaderBackgroundColor = "#ECFDF5"
chartCategoricalColors = ["#059669", "#64756A", "#B45309", "#B91C1C", "#166534"]

[theme.dark]
primaryColor = "#34D399"
backgroundColor = "#07130F"
secondaryBackgroundColor = "#173326"
textColor = "#ECFDF5"
borderColor = "#28513C"
linkColor = "#34D399"
codeBackgroundColor = "#173326"
dataframeHeaderBackgroundColor = "#173326"
chartCategoricalColors = ["#34D399", "#9AB7A5", "#FBBF24", "#F87171", "#86EFAC"]

[theme.light.sidebar]
backgroundColor = "#F0FDF4"
secondaryBackgroundColor = "#ECFDF5"
textColor = "#14251B"
borderColor = "#D1FAE5"

[theme.dark.sidebar]
backgroundColor = "#0A1C15"
secondaryBackgroundColor = "#173326"
textColor = "#ECFDF5"
borderColor = "#28513C"
