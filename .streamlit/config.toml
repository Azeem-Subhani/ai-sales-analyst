# Dashboard theme (Week 7 redesign, built to the owner's HTML chat mock-up): a soft
# green-grey page, white cards with gentle shadows (style.css), a deep emerald accent and
# Inter (self-hosted in src/ui/static/fonts, OFL). The colours are the tokens in
# src/ui/style.py (TOKENS); tests/test_ui_style.py checks that they match. The viewer
# picks System, Light or Dark in the top-right menu (⋮ > Settings); System follows the
# operating system.

[server]
runOnSave = false
# Local use only: on all interfaces anyone on the network could ask questions
# (spending credit) and press the approval buttons.
address = "localhost"
# Serves src/ui/static (the font files) at app/static/.
enableStaticServing = true

[client]
# "viewer": the top-right menu keeps the viewer options (theme switch, print, record
# screen) and hides the developer ones (Deploy, Rerun, Clear cache). "minimal" would
# hide the whole menu, theme switch included (Week 7 fix).
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-Variable.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/GeistMono-Variable.woff2"
weight = "100 900"
style = "normal"

[theme]
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
codeFont = "'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
baseFontSize = 14
headingFontWeights = 600
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

# primaryColor is the accent (primary buttons, focus, active tab, selected controls).
# Chart series: accent first, muted second (comparisons).
[theme.light]
primaryColor = "#0B7A54"
backgroundColor = "#EFF3F1"
secondaryBackgroundColor = "#E3F5EC"
textColor = "#0F1A15"
borderColor = "rgba(15, 26, 21, 0.09)"
linkColor = "#095F42"
codeBackgroundColor = "#E3F5EC"
dataframeHeaderBackgroundColor = "#E3F5EC"
chartCategoricalColors = ["#0B7A54", "#5B6862", "#B45309", "#B91C1C", "#166534"]

[theme.dark]
primaryColor = "#3DD69B"
backgroundColor = "#0E1411"
secondaryBackgroundColor = "#1D2823"
textColor = "#EEF4F0"
borderColor = "rgba(255, 255, 255, 0.09)"
linkColor = "#62E3B2"
codeBackgroundColor = "#1D2823"
dataframeHeaderBackgroundColor = "#1D2823"
chartCategoricalColors = ["#3DD69B", "#9AA9A1", "#FBBF24", "#F87171", "#86EFAC"]

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#E3F5EC"
textColor = "#0F1A15"
borderColor = "rgba(15, 26, 21, 0.09)"

[theme.dark.sidebar]
backgroundColor = "#161E1A"
secondaryBackgroundColor = "#1D2823"
textColor = "#EEF4F0"
borderColor = "rgba(255, 255, 255, 0.09)"
