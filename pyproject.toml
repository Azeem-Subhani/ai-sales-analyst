# Tool settings only. Dependencies live in requirements.txt / requirements-dev.txt.

[tool.ruff]
target-version = "py312"
line-length = 100
# docs/project_plan.md is read-only; ruff would otherwise reformat its code blocks.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Default rules plus import sorting, pyupgrade and common bug patterns.
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the src package from the repo root
# Slow tests (real statsforecast fits, Week 5 acceptance) are skipped by default; run
# them with "pytest -m slow" (only those) or "pytest --runslow" (everything).
markers = ["slow: real forecast fits and acceptance tests (about 2 minutes)"]
