# Five example question -> SQL pairs shown to the model in the system prompt.
# Each was run against the seed-42 database and cross-checked against the Week 2
# KPI functions (src/analytics/kpis.py). tests/test_agent.py runs every query through
# the SQL guard and checks the "check" value, so an example can never drift from the data.

- question: What was net revenue by category in September 2026?
  sql: |
    SELECT p.category,
           round(sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct)), 2) AS net_revenue
    FROM orders o
    JOIN order_items oi USING (order_id)
    JOIN products p USING (product_id)
    WHERE o.status = 'completed'
      AND o.order_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
    GROUP BY p.category
    ORDER BY net_revenue DESC
  check: {row: 0, values: {category: Electronics, net_revenue: 138013.04}}

- question: Who were the top 5 customers by net revenue in August 2026?
  sql: |
    SELECT c.name AS customer, c.customer_type,
           round(sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct)), 2) AS net_revenue
    FROM orders o
    JOIN order_items oi USING (order_id)
    JOIN customers c USING (customer_id)
    WHERE o.status = 'completed'
      AND o.order_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31'
    GROUP BY c.name, c.customer_type
    ORDER BY net_revenue DESC
    LIMIT 5
  check: {row: 0, values: {customer: Bennett-Thornton, net_revenue: 3686.11}}

- question: How has weekly Apparel net revenue moved over the 13 weeks to 27 Sep 2026?
  sql: |
    SELECT date_trunc('week', o.order_date)::DATE AS week_start,
           round(sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct)), 2) AS net_revenue
    FROM orders o
    JOIN order_items oi USING (order_id)
    JOIN products p USING (product_id)
    WHERE o.status = 'completed'
      AND p.category = 'Apparel'
      AND o.order_date BETWEEN DATE '2026-06-29' AND DATE '2026-09-27'
    GROUP BY week_start
    ORDER BY week_start
  check: {row: 12, values: {week_start: "2026-09-21", net_revenue: 11190.74}}

- question: What was the return rate by channel in July to September 2026?
  sql: |
    SELECT channel,
           round(100 * count(*) FILTER (WHERE status = 'returned')
                 / count(*) FILTER (WHERE status IN ('completed', 'returned')), 1)
           AS return_rate_pct
    FROM orders
    WHERE order_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30'
    GROUP BY channel
    ORDER BY return_rate_pct DESC
  check: {row: 0, values: {channel: marketplace, return_rate_pct: 5.7}}

- question: What was the gross margin in August 2026?
  sql: |
    SELECT round(100 * (1 - sum(oi.quantity * p.unit_cost)
                     / sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct))), 1)
           AS gross_margin_pct
    FROM orders o
    JOIN order_items oi USING (order_id)
    JOIN products p USING (product_id)
    WHERE o.status = 'completed'
      AND o.order_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31'
  check: {row: 0, values: {gross_margin_pct: 43.2}}
