- id: q14
  topic: cancellations, comparison
  question: What was the cancellation rate in the week ending 27 September 2026, and how did it change
    from the week before?
  expected_tools:
  - get_kpis
  gold_sql: |
    WITH r AS (
      SELECT count(*) FILTER (WHERE status = 'cancelled' AND order_date >= DATE '2026-09-21')
               / count(*) FILTER (WHERE order_date >= DATE '2026-09-21') AS cur,
             count(*) FILTER (WHERE status = 'cancelled' AND order_date < DATE '2026-09-21')
               / count(*) FILTER (WHERE order_date < DATE '2026-09-21') AS prev
      FROM orders
      WHERE order_date BETWEEN DATE '2026-09-14' AND DATE '2026-09-27'
    )
    SELECT round(100 * cur, 1) AS cancellation_rate_pct,
           round(100 * (cur - prev), 1) AS change_pp
    FROM r
  grade:
    numbers:
    - column: cancellation_rate_pct
      decimals: 1
    - column: change_pp
      decimals: 1
  gold:
    numbers:
    - label: cancellation_rate_pct
      value: 3.6
      decimals: 1
    - label: change_pp
      value: 1.6
      decimals: 1

