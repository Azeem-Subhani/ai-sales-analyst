- id: q18
  topic: forecast vs actuals, Classic Denim Jacket
  question: Across the 8 forecast weeks (3 Aug to 27 Sep 2026), what were total forecast units and total
    actual demand for the Classic Denim Jacket (AP-1150)?
  expected_tools:
  - get_forecast
  - run_sql
  gold_sql: |
    SELECT round((SELECT sum(f.forecast_qty) FROM forecasts f JOIN products p USING (product_id)
                  WHERE p.sku = 'AP-1150'), 1) AS forecast_units,
           (SELECT sum(oi.quantity) FROM orders o JOIN order_items oi USING (order_id)
              JOIN products p USING (product_id)
            WHERE p.sku = 'AP-1150' AND o.status <> 'cancelled'
              AND o.order_date BETWEEN DATE '2026-08-03' AND DATE '2026-09-27') AS actual_units
  grade:
    numbers:
    - column: forecast_units
      decimals: 1
    - column: actual_units
      decimals: 0
  gold:
    numbers:
    - label: forecast_units
      value: 500.1
      decimals: 1
    - label: actual_units
      value: 393
      decimals: 0

