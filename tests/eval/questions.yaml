- id: q17
  topic: Apparel decline
  question: How much has Apparel net revenue fallen from July to September 2026?
  expected_tools:
  - run_sql
  gold_sql: |
    WITH r AS (
      SELECT sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct))
               FILTER (WHERE o.order_date BETWEEN DATE '2026-07-01' AND DATE '2026-07-31') AS jul,
             sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct))
               FILTER (WHERE o.order_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30') AS sep
      FROM orders o JOIN order_items oi USING (order_id) JOIN products p USING (product_id)
      WHERE o.status = 'completed' AND p.category = 'Apparel'
    )
    SELECT round(jul, 2) AS july, round(sep, 2) AS september,
           round(100 * (sep - jul) / jul, 1) AS change_pct
    FROM r
  grade:
    numbers:
    - column: july
      decimals: 2
    - column: september
      decimals: 2
    - column: change_pct
      decimals: 1
  gold:
    numbers:
    - label: july
