# Agent evaluation set: 25 questions a sales manager would ask (20 from Week 4,
# 5 demand-planning questions from Week 5).
#
# Each question has gold_sql (written by hand, run read-only by scripts/fill_gold.py)
# or, for demand planning, gold_planning_sql (run read-only on the stored snapshot in
# planning.duckdb)
# and a grade spec that says which result cells are the key numbers and names.
# The "gold" blocks are written by scripts/fill_gold.py from the SQL; never edit
# them by hand. Grading rules are in src/agent/eval_grader.py.
#
# Values are in display units: money with 2 decimals, rates and changes as
# percentages with 1 decimal (43.1 means 43.1%), counts as whole numbers.
# The agent's "today" is DATA_END_DATE = 2026-09-30.

- id: q01
  topic: headline KPIs, day
  question: What was net revenue and how many orders did we have on 29 September 2026?
  expected_tools:
  - get_kpis
  gold_sql: |
    SELECT round(sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct)), 2) AS net_revenue,
           count(DISTINCT o.order_id) AS orders
    FROM orders o JOIN order_items oi USING (order_id)
    WHERE o.status = 'completed' AND o.order_date = DATE '2026-09-29'
  grade:
    numbers:
    - column: net_revenue
      decimals: 2
    - column: orders
      decimals: 0
  gold:
    numbers:
    - label: net_revenue
      value: 12508.64
      decimals: 2
    - label: orders
      value: 73
      decimals: 0

- id: q02
  topic: headline KPIs, week
  question: What were net revenue, orders and average order value for the week ending 27 September 2026?
  expected_tools:
  - get_kpis
  gold_sql: |
    WITH w AS (
      SELECT sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct)) AS revenue,
             count(DISTINCT o.order_id) AS orders
      FROM orders o JOIN order_items oi USING (order_id)
      WHERE o.status = 'completed'
        AND o.order_date BETWEEN DATE '2026-09-21' AND DATE '2026-09-27'
    )
    SELECT round(revenue, 2) AS net_revenue, orders, round(revenue / orders, 2) AS aov FROM w
  grade:
    numbers:
    - column: net_revenue
      decimals: 2
    - column: orders
      decimals: 0
    - column: aov
      decimals: 2
  gold:
    numbers:
    - label: net_revenue
      value: 114286.82
      decimals: 2
    - label: orders
      value: 661
      decimals: 0
    - label: aov
      value: 172.9
      decimals: 2

- id: q03
  topic: headline KPIs, month
  question: Give me the headline numbers for August 2026 - net revenue, orders and gross margin.
  expected_tools:
  - get_kpis
  gold_sql: |
    SELECT round(sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct)), 2) AS net_revenue,
           count(DISTINCT o.order_id) AS orders,
           round(100 * (1 - sum(oi.quantity * p.unit_cost)
                 / sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct))), 1) AS gross_margin_pct
    FROM orders o JOIN order_items oi USING (order_id) JOIN products p USING (product_id)
    WHERE o.status = 'completed'
      AND o.order_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31'
  grade:
    numbers:
    - column: net_revenue
      decimals: 2
    - column: orders
      decimals: 0
    - column: gross_margin_pct
      decimals: 1
  gold:
    numbers:
    - label: net_revenue
      value: 462431.56
      decimals: 2
    - label: orders
      value: 2747
      decimals: 0
    - label: gross_margin_pct
      value: 43.2
      decimals: 1

- id: q04
  topic: comparison, week over week
  question: How did net revenue in week 39 of 2026 compare with the previous week?
  expected_tools:
  - get_kpis
  gold_sql: |
    WITH r AS (
      SELECT sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct))
               FILTER (WHERE o.order_date BETWEEN DATE '2026-09-21' AND DATE '2026-09-27') AS cur,
             sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct))
               FILTER (WHERE o.order_date BETWEEN DATE '2026-09-14' AND DATE '2026-09-20') AS prev
      FROM orders o JOIN order_items oi USING (order_id)
      WHERE o.status = 'completed'
    )
    SELECT round(cur, 2) AS this_week, round(prev, 2) AS previous_week,
           round(100 * (cur - prev) / prev, 1) AS change_pct
    FROM r
  grade:
    numbers:
    - column: this_week
      decimals: 2
    - column: change_pct
      decimals: 1
  gold:
    numbers:
    - label: this_week
      value: 114286.82
      decimals: 2
    - label: change_pct
      value: 2.5
      decimals: 1

- id: q05
  topic: comparison, year over year
  question: How did August 2026 net revenue compare with August 2025?
  expected_tools:
  - get_kpis
  gold_sql: |
    WITH r AS (
      SELECT sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct))
               FILTER (WHERE o.order_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31') AS cur,
             sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct))
               FILTER (WHERE o.order_date BETWEEN DATE '2025-08-01' AND DATE '2025-08-31') AS ly
      FROM orders o JOIN order_items oi USING (order_id)
      WHERE o.status = 'completed'
    )
    SELECT round(cur, 2) AS aug_2026, round(ly, 2) AS aug_2025,
           round(100 * (cur - ly) / ly, 1) AS change_pct
    FROM r
  grade:
    numbers:
    - column: aug_2026
      decimals: 2
    - column: aug_2025
      decimals: 2
    - column: change_pct
      decimals: 1
  gold:
