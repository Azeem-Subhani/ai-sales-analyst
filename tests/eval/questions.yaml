  question: What was the return rate in September 2026, and how many orders were returned?
  expected_tools:
  - get_kpis
  gold_sql: |
    SELECT round(100 * count(*) FILTER (WHERE status = 'returned')
                 / count(*) FILTER (WHERE status IN ('completed', 'returned')), 1) AS return_rate_pct,
           count(*) FILTER (WHERE status = 'returned') AS returned_orders
    FROM orders
    WHERE order_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
